# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G

minecraft_version=1.8.9
# SHA-1 of Mojang's client jar for minecraft_version (`downloads.client.sha1` in the version JSON) -
# the jar is fetched by this hash.
minecraft_client_sha1=3870888a6c3d349d3771a3e9d16c9bf5e076b908
# Minecraft 1.8.9 runs on Java 8, so that's what the mod is compiled for. Any JDK that can still
# target Java 8 works for building; `verifyMixins` fetches a real Java 8 for itself.
java_version=8

# Mod Properties
mod_version=0.1.12
maven_group=com.tntsallin1client

# Dependencies
# Legacy Fabric's Yarn (CC0): the names for the obfuscated game. Only used while building - the
# built jar refers to the game by its obfuscated names again.
legacy_yarn_version=1.8.9+build.604
launchwrapper_version=1.12
mixin_version=0.7.11-SNAPSHOT
tiny_remapper_version=0.14.1
