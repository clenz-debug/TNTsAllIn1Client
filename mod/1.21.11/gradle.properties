# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.3
# Pinned to an exact release, not the floating "1.17-SNAPSHOT" tag this used to be - that tag
# silently resolves to whatever the newest build under it is, and a fresh build against it broke
# ("Cannot remap access widener from namespace 'official'. Expected: 'intermediary'") the moment a
# newer snapshot build (1.17.21) got published upstream mid-session, with zero change on our side.
# 1.17.20 is the exact build already confirmed working earlier in this same session.
loom_version=1.17.20
# Minecraft's own minimum Java version for minecraft_version above (not a Fabric/Loom concept -
# discovered the hard way once when Loom refused to configure with "Minecraft 26.1.2 requires Java
# 25 but Gradle is using 21"). Change this together with minecraft_version, same as loader_version/
# fabric_api_version - a stale value here breaks the build the same way a stale fabric_api_version
# would. Needs a matching JDK actually installed and pointed to via JAVA_HOME/org.gradle.java.home
# when building (mod-bundle-release-runbook.md documents this per Minecraft-version switch).
java_version=21

# Mod Properties
mod_version=0.1.0
maven_group=com.tntsallin1client

# Dependencies
fabric_api_version=0.141.5+1.21.11
