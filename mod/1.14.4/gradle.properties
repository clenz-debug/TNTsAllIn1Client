# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.14.4
loader_version=0.19.3
# Pinned to an exact release like in the other versions (see mod/1.21.11/gradle.properties for why).
loom_version=1.17.20
# Minecraft 1.14.4 runs on Java 8, so the mod is compiled for it - with the same JDK the other
# versions build with (release 8), no separate JDK 8 needed. Java 8 language level only: no `var`,
# no records, no switch expressions, no text blocks.
java_version=8

# Mod Properties
mod_version=0.1.11
maven_group=com.tntsallin1client

# Dependencies
# The last Fabric API for 1.14.x.
fabric_api_version=0.28.5+1.14
