# Phase 9: packaging config for electron-builder.
appId: com.tntsallin1client.launcher
productName: TNT's All-In-1 Client
copyright: Copyright © 2026 clenz-debug

directories:
  output: dist

# The installed launcher's app name - and with it its data folder, %APPDATA%\tntsallin1client (login,
# settings, instances, downloaded bundles). Deliberately not package.json's `tntsallin1client-launcher`,
# which the dev launcher uses: an installed copy on the developer's own PC must not share (and
# overwrite) the dev launcher's settings, and needs its own clean state to test a real install.
extraMetadata:
  name: tntsallin1client

# out/ (electron-vite's build output), resources/ (own branding - main/index.ts's BrowserWindow
# icon, generated from designs/branding/N-Logo.svg) and package.json are needed at runtime -
# everything else (src/, the bundle folders, dev configs) is either irrelevant to a packaged app or
# handled separately below via extraResources. node_modules (production deps only, e.g.
# electron-updater) is included automatically by electron-builder's own default file set.
files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!mods-bundle/**'
  - '!resourcepacks-bundle/**'

# Copied into <packaged-app>/resources/ at package time - see resourcePaths.ts's bundledResourcesRoot()
# for how the app finds these at runtime. mods-bundle/resourcepacks-bundle are git-ignored folders
# only dev mode reads (see Aktuelle_Phase.md). own-mod grabs whatever `gradlew build` in the seed
# version's ../mod/<version>/ project most recently produced, excluding Loom's sources/dev jar
# variants - run that build fresh right before packaging so the newest mod code ships, not a stale
# one.
#
# Multi-version support: the versions with a baked own mod are listed here by hand and must match
# `SEED_BUNDLE_MINECRAFT_VERSIONS` in shared/types.ts (this YAML can't import a TS constant - see
# mod-bundle-release-runbook.md). seed-manifest.json records which manifest state the installer
# corresponds to (modBundleUpdater.ts#appliedState). Downloads never go in here: resources/ sits
# inside the install folder (maybe under "Program Files") and is replaced by every update - they go
# to userData/bundles/ instead (resourcePaths.ts).
#
# No third-party mods or resource packs in the installer (2026-09-30): JellySquid's OK for Sodium
# covers the launcher downloading it from Modrinth, not us redistributing the jar, and 3D Skin
# Layers' license grants no redistribution at all (Projekt_Roadmap.md's license section). With no
# baked mods-bundle/, the first "Play" (or opening the Mods screen) downloads the whole bundle via
# the manifest instead - modBundleUpdater.ts#ensureLocalBundle. Only our own mod stays baked, as the
# fallback downloadCompleteBundle copies when the manifest names no own mod for a version.
extraResources:
  - from: ../mod/1.21.11/build/libs
    to: own-mod/1.21.11
    filter:
      - '*.jar'
      - '!*-sources.jar'
      - '!*-dev.jar'
  - from: ../mod/26.1.2/build/libs
    to: own-mod/26.1.2
    filter:
      - '*.jar'
      - '!*-sources.jar'
      - '!*-dev.jar'
  - from: ../mod-bundle-manifest.json
    to: seed-manifest.json
  # The project's own license plus the license text of every third-party mod, resource pack, font
  # and npm package the installer ships - most of those licenses require passing their text on
  # along with the software. Keep third-party-licenses/ in sync with the bundle folders (see its
  # README.txt and mod-bundle-release-runbook.md).
  - from: ../LICENSE
    to: LICENSE.txt
  - from: third-party-licenses
    to: third-party-licenses

win:
  target: nsis
  # Not build/icon.ico - the repo's .gitignore blanket-ignores every build/ folder (Gradle output
  # in mod/*/), so this lives alongside the runtime icon in resources/ instead, which isn't ignored.
  icon: resources/icon.ico
nsis:
  # No version in the file name (own user request): a permanent direct link to the newest installer,
  # .../releases/latest/download/tntsallin1client-setup.exe. Auto-update reads the file name from
  # latest.yml, so it doesn't care. The version shows in the launcher's settings ("About").
  artifactName: tntsallin1client-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

# electron-updater checks this repo's GitHub Releases for newer versions (see main/autoUpdate.ts).
# `electron-builder --publish` is the only command that actually uploads anything here - a normal
# `electron-builder`/`npm run package:win` build never touches GitHub, it just needs this section
# present so electron-updater's generated `app-update.yml` points at the right place.
publish:
  provider: github
  owner: clenz-debug
  repo: TNTsAllIn1Client
  # A published release, not a draft: electron-updater never sees drafts (or pre-releases), so a
  # draft would silently mean "no update" for everyone.
  releaseType: release
