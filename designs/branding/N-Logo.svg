<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" width="600" height="660">
  <!-- Octagon outline - background2 (#1a1a1a), same value the wood-beam outline already used -->
  <polygon points="200,40 400,40 560,200 560,400 400,560 200,560 40,400 40,200"
           fill="none" stroke="#1a1a1a" stroke-width="4"/>

  <!-- N logo, four beams - one accent color each (own wishlist item: recolor the logo to the
       default theme instead of the original wood-grain look). See renderer/src/Logo.tsx for the
       theme-reactive inline-SVG version used inside the launcher itself - keep both in sync if
       this shape ever changes; this file stays flat, default-theme colors for external uses
       (packaged app icon, README, ...) that can't react live to a user's own theme. -->
  <g stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round">
    <!-- Top horizontal beam (übersteht links/rechts wie bei einem T) - Akzent 1 -->
    <rect x="150" y="150" width="300" height="50" fill="#3d3d3d"/>

    <!-- Left vertical leg - Akzent 2 -->
    <rect x="185" y="200" width="45" height="240" fill="#4d4d4d"/>

    <!-- Right vertical leg - Akzent 3 -->
    <rect x="370" y="200" width="45" height="240" fill="#5d5d5d"/>

    <!-- Diagonal beam connecting the two legs (beginnt oben genau am Querbalken) - Akzent 4 -->
    <polygon points="185,200 230,200 415,415 415,440 370,440 185,225"
             fill="#6d6d6d"/>
  </g>

  <!-- Text - background2, same as the outline -->
  <text x="300" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="72" fill="#1a1a1a">A I <tspan font-size="78">1</tspan></text>
  <text x="300" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="26" letter-spacing="4" fill="#1a1a1a">CLIENT</text>
</svg>
