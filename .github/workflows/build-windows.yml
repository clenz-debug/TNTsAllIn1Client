# Builds the Windows installer on a GitHub-hosted runner. SignPath Foundation's code signing only
# signs what a GitHub workflow built from this repository, so a release build has to come from
# here rather than from a developer PC. Started by hand; it uploads the result as a workflow
# artifact and publishes nothing.
name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Each mod project needs exactly its Minecraft version's Java (see mod/*/gradle.properties)
      - name: Set up Java 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Build mod for Minecraft 1.21.11
        working-directory: mod/1.21.11
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew build

      - name: Build mod for Minecraft 26.1.2
        working-directory: mod/26.1.2
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_25_X64" ./gradlew build

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      # The installer packs both mod jars from mod/*/build/libs (launcher/electron-builder.yml)
      - name: Build launcher installer
        working-directory: launcher
        run: |
          npm ci
          npm run typecheck
          npm run package:win

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          if-no-files-found: error
          path: |
            launcher/dist/tntsallin1client-setup.exe
            launcher/dist/tntsallin1client-setup.exe.blockmap
            launcher/dist/latest.yml
            mod/*/build/libs/tntsallin1client-*.jar
            !mod/*/build/libs/*-sources.jar
